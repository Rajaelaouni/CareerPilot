version: '3.9'

services:

  db:
    image: postgres:15
    container_name: careerpilot_db
    restart: always
    environment:
      POSTGRES_DB: PFAdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cesar
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: careerpilot_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: careerpilot_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true