
services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: PFAdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cesar
    ports:
      - "5432:5432"

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true